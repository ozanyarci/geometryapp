name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy çalışsın; sıradaki push öncekini iptal etsin.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Proje sayfası ozanyarci.github.io/geometryapp/ altında servis edildiği
      # için varlık yolları bu ön eke göre üretilmeli.
      - run: npm run build -- --base-href /geometryapp/

      # GitHub Pages statik dosya sunar ve eşleşmeyen yolları 404.html'e
      # düşürür. index.html kopyası, derin linklerde ve sayfa yenilemede
      # Angular router'ın devralmasını sağlar.
      - run: cp dist/geometry-app/browser/index.html dist/geometry-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/geometry-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
